<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Tele Communication</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<style>

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  text-align: center;
  background: linear-gradient(135deg, #fff6ec, #ffe9d6, #ffd2a8);
  overflow-x: hidden;
}

/* 🔥 固定导航 */
nav {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  z-index: 999;
}

/* HERO */
.hero {
  margin-top: -70px;
}

/* LOGO */
.logo {
  max-width: 380px;
  margin-top: -80px;
  margin-bottom: -80px;
  animation: float 4s ease-in-out infinite;
  transition: 0.4s;
}

.logo:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 35px rgba(255,180,120,1));
}

/* 浮动 */
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

/* 标题 */
h1 {
  font-size: 1.8rem;
  margin: 0;
}

.tagline {
  font-size: 0.95rem;
}

/* 分区 */
.section {
  padding: 40px 10px;
}

/* 卡片 */
.card {
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transition: 0.3s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-12px) scale(1.05);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

/* 图片 */
.card img {
  width: 100%;
}

/* 🔥 放大图片 */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  padding-top: 80px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
}

.modal img {
  max-width: 90%;
}

/* WhatsApp */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 12px 16px;
  border-radius: 50px;
  text-decoration: none;
}

/* Call */
.call {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: #007bff;
  color: white;
  padding: 12px 16px;
  border-radius: 50px;
  text-decoration: none;
}

/* 🔥 Scroll动画 */
.hidden {
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.8s ease;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

</style>

</head>

<body>

<nav class="container-fluid">
  <ul>
    <li><strong>WTC</strong></li>
  </ul>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#gallery">Services</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero hidden">
  <img src="logo.png" class="logo">
  <h1>World Tele Communication</h1>
  <p class="tagline">Mobile Repair | POS System | Sales & Service</p>
</section>

<!-- GALLERY -->
<section id="gallery" class="section hidden">
  <h3>Our Work Gallery</h3>

  <div class="grid">

    <article class="card" onclick="openModal(this)">
      <img src="ipos.png">
      <p>POS System</p>
    </article>

    <article class="card" onclick="openModal(this)">
      <img src="pospay.png">
      <p>POSPay</p>
    </article>

    <article class="card" onclick="openModal(this)">
      <img src="salesplay.png">
      <p>SalesPlay</p>
    </article>

    <article class="card" onclick="openModal(this)">
      <img src="sunmi.png">
      <p>Sunmi</p>
    </article>

  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section hidden">
  <h3>Contact Us</h3>
  <p>📞 +60163456287</p>
  <p>📧 Wtc063369841@gmail.com</p>
</section>

<!-- Modal -->
<div id="modal" class="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<!-- Buttons -->
<a href="https://wa.me/60163456287" class="whatsapp">WhatsApp</a>
<a href="tel:+60163456287" class="call">Call</a>

<footer class="container">
  <small>© 2026 WTC</small>
</footer>

<script>

/* 放大图片 */
function openModal(el) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modalImg").src = el.querySelector("img").src;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* 滚动动画 */
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
});

document.querySelectorAll('.hidden').forEach(el => observer.observe(el));

</script>

</body>
</html>
