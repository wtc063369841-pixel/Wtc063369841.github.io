<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Tele Communication</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<style>

body {
  text-align: center;
  background: linear-gradient(to bottom, #fff6ec, #ffe9d6);
  margin: 0;
  overflow-x: hidden;
}

/* NAV */
nav {
  margin: 0;
  padding: 5px 10px;
}

/* 主区域往上 */
main {
  margin-top: -60px;
}

/* 🔥 LOGO 动画 */
.logo {
  max-width: 360px;
  margin-top: -70px;
  margin-bottom: -70px;
  animation: float 4s ease-in-out infinite;
  transition: all 0.4s ease;
}

/* Hover 发光 */
.logo:hover {
  transform: scale(1.08);
  filter: drop-shadow(0 0 25px rgba(255,180,120,0.9));
}

/* 浮动动画 */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

/* 标题动画 */
h2 {
  font-size: 1.6rem;
  margin: 0;
  white-space: nowrap;
  animation: fadeIn 1.2s ease forwards;
}

p {
  margin: 3px 0 5px;
  font-size: 0.95rem;
  animation: fadeIn 1.8s ease forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

hr {
  margin: 10px 0;
}

/* Gallery 标题 */
h3 {
  animation: fadeIn 2s ease forwards;
}

/* 卡片 */
.card {
  margin-bottom: 20px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
}

/* 卡片 Hover */
.card:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.card img {
  width: 100%;
}

.card p {
  padding: 10px;
  font-weight: bold;
}

</style>

</head>

<body>

<nav class="container-fluid">
  <ul>
    <li><strong>WTC</strong></li>
  </ul>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main class="container">

  <!-- LOGO -->
  <img src="logo.png" class="logo">

  <!-- 标题 -->
  <h2>World Tele Communication</h2>

  <p>Mobile Repair | POS System | Sales & Service</p>

  <hr>

  <h3>Our Work Gallery</h3>

  <div class="grid">

    <article class="card">
      <img src="ipos.png">
      <p>POS System Setup</p>
    </article>

    <article class="card">
      <img src="pospay.png">
      <p>POSPay System</p>
    </article>

    <article class="card">
      <img src="salesplay.png">
      <p>SalesPlay POS</p>
    </article>

    <article class="card">
      <img src="sunmi.png">
      <p>Sunmi Device</p>
    </article>

  </div>

</main>

<footer class="container">
  <small>
    Contact: +60163456287 • Wtc063369841@gmail.com
  </small>
</footer>

</body>
</html>
