<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WTC Gallery Pro Max</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<style>

/* 分类按钮 */
.filter-btns {
  text-align: center;
  margin-bottom: 20px;
}
.filter-btns button {
  margin: 5px;
}
.filter-btns button.active {
  background-color: black;
  color: white;
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

/* 卡片效果🔥 */
.card {
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}
.card:hover {
  transform: translateY(-5px);
}

/* 图片 */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
}

/* 文字说明🔥 */
.caption {
  padding: 10px;
  font-size: 14px;
}

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
}
.lightbox img {
  max-width: 90%;
  max-height: 80%;
  margin: auto;
  display: block;
  margin-top: 5%;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}

.nav-btn {
  position: absolute;
  top: 50%;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
.prev { left: 20px; }
.next { right: 20px; }

</style>
</head>

<body>

<main class="container">

<h2 style="text-align:center;">Our Work Gallery</h2>

<!-- 🔥 分类 -->
<div class="filter-btns">
  <button class="active" onclick="filterGallery('all', this)">All</button>
  <button onclick="filterGallery('repair', this)">Mobile Repair</button>
  <button onclick="filterGallery('pos', this)">POS Setup</button>
  <button onclick="filterGallery('shop', this)">Shop</button>
</div>

<!-- 🔥 Gallery -->
<div class="gallery">

<div class="card repair">
<img src="repair1.jpg" onclick="openLightbox(0)">
<div class="caption">iPhone Screen Repair</div>
</div>

<div class="card repair">
<img src="repair2.jpg" onclick="openLightbox(1)">
<div class="caption">Motherboard Repair Service</div>
</div>

<div class="card pos">
<img src="pos1.jpg" onclick="openLightbox(2)">
<div class="caption">Restaurant POS Installation</div>
</div>

<div class="card pos">
<img src="pos2.jpg" onclick="openLightbox(3)">
<div class="caption">Handheld POS Setup</div>
</div>

<div class="card shop">
<img src="shop1.jpg" onclick="openLightbox(4)">
<div class="caption">Our Shop Front</div>
</div>

<div class="card shop">
<img src="shop2.jpg" onclick="openLightbox(5)">
<div class="caption">Inside Our Store</div>
</div>

</div>

</main>

<!-- 🔥 Lightbox -->
<div class="lightbox" id="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<span class="nav-btn prev" onclick="changeSlide(-1)">❮</span>
<img id="lightbox-img">
<span class="nav-btn next" onclick="changeSlide(1)">❯</span>
</div>

<script>

let images = [
"repair1.jpg","repair2.jpg",
"pos1.jpg","pos2.jpg",
"shop1.jpg","shop2.jpg"
];

let currentIndex = 0;

/* 分类 */
function filterGallery(category, btn) {
  let cards = document.querySelectorAll(".card");
  let buttons = document.querySelectorAll(".filter-btns button");

  buttons.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  cards.forEach(card => {
    if (category === "all") {
      card.style.display = "block";
    } else {
      card.style.display = card.classList.contains(category) ? "block" : "none";
    }
  });
}

/* Lightbox */
function openLightbox(index) {
  currentIndex = index;
  document.getElementById("lightbox").style.display = "block";
  document.getElementById("lightbox-img").src = images[index];
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function changeSlide(step) {
  currentIndex += step;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;
  document.getElementById("lightbox-img").src = images[currentIndex];
}

</script>

</body>
</html>
